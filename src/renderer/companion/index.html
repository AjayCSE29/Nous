<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self';">
  <title>Nous Companion</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="../vendor/katex/katex.min.css">
</head>
<body>
  <header>
    <span class="brand"><img class="logo" src="../../../assets/icons/logo.svg" alt=""> Nous</span>
    <select id="models" aria-label="Model"></select>
    <button id="pin" aria-label="Always on top">⌁</button>
    <button aria-label="More options">•••</button>
  </header>
  <main>
    <section id="welcome">
      <h1>How can I help?</h1>
      <p>Ask Nous about what you're working on.</p>
      <div>
        <button>Summarize this</button>
        <button>Explain this</button>
        <button>Draft a reply</button>
      </div>
    </section>
    <section id="chat" aria-live="polite" hidden></section>
  </main>
  <section id="context" hidden>
    <small>Current context</small>
    <strong id="context-label"></strong>
    <button id="remove" aria-label="Remove context">×</button>
  </section>
  <div class="context-row">
    <div class="context-picker">
      <button id="add">＋ Add context</button>
      <div id="context-menu" hidden role="menu" aria-label="Attach context">
        <button data-kind="selection" role="menuitem">Paste selection…</button>
        <button data-kind="window" role="menuitem">Current window</button>
        <button data-kind="file" role="menuitem">Choose file…</button>
      </div>
    </div>
    <span id="using">No context</span>
    <span class="local-badge">Local</span>
  </div>
  <dialog id="select-dialog">
    <form method="dialog">
      <h2>Paste selection</h2>
      <p>Nous reads only what you paste here, once, for this request.</p>
      <textarea id="select-text" aria-label="Selected text" placeholder="Paste the text you want Nous to see…"></textarea>
      <div class="dialog-actions">
        <button value="cancel">Cancel</button>
        <button value="default" id="select-confirm">Attach</button>
      </div>
    </form>
  </dialog>
  <form id="composer">
    <textarea id="prompt" placeholder="Ask Nous about this…" rows="1"></textarea>
    <button id="stop" aria-label="Stop generating" hidden>▪</button>
    <button aria-label="Send message">↑</button>
  </form>
  <script src="../vendor/marked.umd.js"></script>
  <script src="../vendor/purify.min.js"></script>
  <script src="../vendor/katex/katex.min.js"></script>
  <script src="../vendor/katex/auto-render.min.js"></script>
  <script src="../shared/markdown.js"></script>
  <script src="app.js"></script>
</body>
</html>
